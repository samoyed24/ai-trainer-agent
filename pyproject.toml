[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trainer-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
]

[project.scripts]
ai-trainer-config = "ai_trainer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_trainer_agent*"]
